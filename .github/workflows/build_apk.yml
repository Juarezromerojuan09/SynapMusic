name: Compilar SynapMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd cliente-finamp
          flutter pub get

      - name: Compilar APK (Release)
        run: |
          cd cliente-finamp
          flutter build apk --release

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SynapMusic-Release-APK
          path: cliente-finamp/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
